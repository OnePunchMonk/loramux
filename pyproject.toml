[project]
name = "loramux"
version = "0.0.1"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "safetensors", "numpy"]

[project.optional-dependencies]
gpu = ["triton"]
dev = ["pytest"]
diffusers = ["diffusers==0.43.0", "peft"]
bench = ["pandas", "matplotlib", "scipy", "pillow"]
modal = ["modal"]
lpips = ["lpips"]

[tool.setuptools.packages.find]
include = ["loramux*", "bench*"]

[tool.pytest.ini_options]
markers = ["gpu: needs a CUDA GPU"]

[tool.ruff]
line-length = 120
target-version = "py310"
